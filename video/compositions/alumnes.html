  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      // Brand colours come from the root variables, so changing `brand` recolours every tween too
      const BRAND = getComputedStyle(document.documentElement).getPropertyValue("--brand").trim() || "#4e70b0";
      const BRAND_SOFT = (() => { const h = BRAND.replace("#", ""); const n = parseInt(h.length === 3 ? h.replace(/./g, "$&$&") : h, 16);
        const m = (c) => Math.round(c * 0.1 + 255 * 0.9); return `rgb(${m(n >> 16 & 255)}, ${m(n >> 8 & 255)}, ${m(n & 255)})`; })();
      const cam = document.querySelector("#al-cam");

      // Position of an element inside the camera (layout space, before any transform)
      function rel(sel) {
        let el = typeof sel === "string" ? document.querySelector(sel) : sel;
        const w = el.offsetWidth, h = el.offsetHeight;
        let x = 0, y = 0;
        while (el && el !== cam) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
        return { x, y, w, h, cx: x + w / 2, cy: y + h / 2 };
      }
      // Cursor tip sits ~5 px in from the svg corner at 64 px
      function point(sel, dx = 0, dy = 0) { const r = rel(sel); return { x: r.cx - 12 + dx, y: r.cy - 8 + dy }; }
      function moveCursor(sel, at, dur = 0.9, dx = 0, dy = 0) {
        const p = point(sel, dx, dy);
        tl.to("#al-cursor", { x: p.x, y: p.y, duration: dur, ease: "power3.inOut" }, at);
      }
      function click(at) {
        tl.to("#al-cursor", { scale: 0.82, duration: 0.07, ease: "power2.in", transformOrigin: "10% 10%" }, at);
        tl.to("#al-cursor", { scale: 1, duration: 0.14, ease: "power2.out" }, at + 0.07);
      }
      function camTo(px, py, s, at, dur = 0.8) {
        tl.to(cam, { x: 960 - px * s, y: 540 - py * s, scale: s, duration: dur, ease: "power2.inOut" }, at);
      }
      function caption(sel, at, out) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01 }, at);
        tl.fromTo(sel, { x: -30 }, { x: 0, duration: 0.5, ease: "expo.out" }, at);
        tl.fromTo(sel + " span", { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" }, at + 0.05);
        if (out) tl.to(sel, { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, out);
      }

      // Initial state
      gsap.set(cam, { transformOrigin: "0 0", x: 0, y: 0, scale: 1 });
      gsap.set(["#al-c1", "#al-c2", "#al-c3", "#al-c4", "#al-c5", "#al-fitxa", "#al-toast", "#al-dd", "#al-pok", "#al-qok", "#al-pdet"], { opacity: 0 });
      gsap.set("#al-u1", { opacity: 1 });
      gsap.set("#al-tab1", { color: BRAND });
      gsap.set("#al-cursor", { x: 2000, y: 1150 });

      // 0 — the white of the table card opens into the platform
      tl.fromTo("#al-white", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, 0);
      tl.fromTo(".al-row", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.04, ease: "power3.out" }, 0.25);
      caption("#al-c1", 0.4, 3.75);

      // 2.0 — switch cycle tab
      moveCursor("#al-tab3", 1.0, 0.9);
      click(2.0);
      tl.to("#al-u1", { opacity: 0, duration: 0.15 }, 2.03);
      tl.to("#al-tab1", { color: "#52596b", duration: 0.15 }, 2.03);
      tl.fromTo("#al-u3", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "expo.out" }, 2.03);
      tl.to("#al-tab3", { color: BRAND, duration: 0.15 }, 2.03);
      tl.fromTo(".al-row", { opacity: 0.15, y: 10 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.04, ease: "power3.out", immediateRender: false }, 2.08);
      camTo(1060, 560, 1.12, 2.4);

      // 4.0 — filter: who has no placement?
      moveCursor("#al-f-prac", 3.05, 0.9);
      click(4.0);
      tl.to("#al-f-prac", { backgroundColor: "#101a33", color: "#ffffff", borderColor: "#101a33", duration: 0.12 }, 4.03);
      const keep = { "#al-r1": 0, "#al-r3": 1, "#al-r6": 2 };
      const rowH = 62;
      ["#al-r0", "#al-r2", "#al-r4", "#al-r5", "#al-r7"].forEach((s) =>
        tl.to(s, { opacity: 0, x: -40, duration: 0.28, ease: "power3.in" }, 4.06));
      Object.entries(keep).forEach(([s, slot]) => {
        const idx = Number(s.slice(-1));
        tl.to(s, { y: (slot - idx) * rowH, duration: 0.5, ease: "power3.inOut" }, 4.25);
      });
      caption("#al-c2", 4.1, 6.9);

      // 6.4 — open Marc's file: the row grows into the file
      const r0 = rel("#al-r0"), fx = rel("#al-fitxa");
      const top0 = r0.y - fx.y, bot0 = fx.y + fx.h - (r0.y + rowH);
      moveCursor("#al-r1", 5.45, 0.9, -120, -rowH);
      click(6.4);
      tl.fromTo("#al-fitxa", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 6.45);
      tl.fromTo("#al-fitxa", { clipPath: `inset(${top0}px 0px ${bot0}px 0px round 14px)` },
        { clipPath: "inset(0px 0px 0px 0px round 14px)", duration: 0.55, ease: "power3.inOut" }, 6.45);
      tl.fromTo(["#al-fhead", "#al-mods", "#al-prac", "#al-pag"], { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.45, stagger: 0.08, ease: "expo.out" }, 6.75);
      camTo(960, 540, 1, 6.4, 0.7);
      // Once the file covers the list, the list leaves the stage
      tl.to(["#al-tabs", "#al-filters", "#al-search", "#al-table"], { opacity: 0, duration: 0.05 }, 7.0);
      caption("#al-c3", 7.2, 11.0);

      // 9.2 — assign a placement
      const prac = rel("#al-prac");
      camTo(prac.cx - 60, prac.cy + 60, 1.2, 7.6);
      moveCursor("#al-assign", 8.25, 0.85);
      click(9.2);
      tl.fromTo("#al-dd", { opacity: 0, scaleY: 0.85, transformOrigin: "50% 0%" }, { opacity: 1, scaleY: 1, duration: 0.2, ease: "power3.out" }, 9.25);
      moveCursor("#al-opt-a", 9.95, 0.75, -80);
      click(10.8);
      tl.to("#al-dd", { opacity: 0, duration: 0.15, ease: "power2.in" }, 10.85);
      tl.to("#al-pbad", { opacity: 0, scale: 0.8, duration: 0.15, ease: "power2.in" }, 10.95);
      tl.fromTo("#al-pok", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 11.0);
      tl.fromTo("#al-pdet", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 11.15);
      caption("#al-c4", 11.2, 12.95);

      // 13.6 — send a payment reminder
      const pag = rel("#al-pag");
      camTo(pag.cx - 40, pag.cy - 20, 1.2, 11.8);
      moveCursor("#al-remind", 12.55, 0.95);
      click(13.6);
      tl.to("#al-qbad", { opacity: 0, scale: 0.8, duration: 0.15, ease: "power2.in" }, 13.65);
      tl.fromTo("#al-qok", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, 13.7);
      camTo(960, 540, 1, 13.65, 0.7);
      tl.fromTo("#al-toast", { opacity: 0, x: 140 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 13.8);
      caption("#al-c5", 13.95, 17.45);

      // Hand-off: the file clears from the stage, the shell stays for the next scene
      tl.to(["#al-fitxa", "#al-toast", "#al-cursor"], { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 17.5);

      window.__timelines["alumnes"] = tl;
    })();
  </script>
