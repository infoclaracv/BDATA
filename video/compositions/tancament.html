<html
  data-composition-variables='[
    {"id":"cta","type":"string","label":"Crida a l acció","default":"Demana una demo"},
    {"id":"tagline","type":"string","label":"Subtítol","default":"Gestió acadèmica i administrativa dels cicles formatius"}
  ]'
>
<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: "Montserrat", sans-serif;
      background: transparent;
    }
    #tc-flood { position: absolute; inset: 0; background: var(--brand); }
    .tc-line {
      position: absolute;
      left: 160px;
      font-size: 110px;
      font-weight: 800;
      letter-spacing: -0.035em;
      color: #fff;
      white-space: nowrap;
    }
    #tc-l1 { top: 330px; }
    #tc-l2 { top: 470px; }
    .tc-line span { display: inline-block; }
    #tc-white { position: absolute; inset: 0; background: #fff; }
    #tc-mark { position: absolute; left: 0; right: 0; top: 300px; text-align: center; color: var(--ink); }
    #tc-logo { display: block; width: 760px; height: auto; margin: 0 auto; }
    #tc-tag { font-size: 40px; font-weight: 700; margin-top: 44px; }
    #tc-cta {
      display: inline-block;
      margin-top: 56px;
      background: var(--brand);
      color: #fff;
      font-size: 40px;
      font-weight: 600;
      padding: 24px 56px;
      border-radius: 10px;
    }
  </style>
  <div id="root" data-composition-id="tancament" data-width="1920" data-height="1080" data-layout-allow-overflow>
    <div id="tc-flood"></div>
    <div id="tc-l1" class="tc-line"><span>Cada</span> <span>alumne,</span> <span>localitzat.</span></div>
    <div id="tc-l2" class="tc-line"><span>Tot</span> <span>el</span> <span>centre,</span> <span>en</span> <span>una</span> <span>web.</span></div>
    <div id="tc-white"></div>
    <div id="tc-mark">
      <img id="tc-logo" src="assets/brand/lanau112-logo.png" alt="LANAU112" />
      <div id="tc-tag" data-var-text="tagline">Gestió acadèmica i administrativa dels cicles formatius</div>
      <div id="tc-cta" data-var-text="cta">Demana una demo</div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Colour flood from the dashboard ring
      tl.fromTo("#tc-flood", { clipPath: "circle(0px at 1395px 490px)" },
        { clipPath: "circle(2300px at 1395px 490px)", duration: 0.5, ease: "power2.inOut" }, 0);

      function line(sel, at) {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01 }, at);
        tl.fromTo(sel + " span", { opacity: 0, filter: "blur(6px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.08, ease: "power2.out" }, at);
      }
      line("#tc-l1", 0.55);
      line("#tc-l2", 1.45);
      tl.to(["#tc-l1", "#tc-l2"], { opacity: 0, filter: "blur(8px)", duration: 0.2, stagger: 0.06, ease: "power3.in" }, 3.0);

      // The white of the website wipes up and the real logo lands, then the tagline and the call to action
      tl.fromTo("#tc-white", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.55, ease: "power3.inOut" }, 3.05);
      tl.fromTo("#tc-mark", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 3.4);
      tl.fromTo("#tc-logo", { opacity: 0, scale: 0.92, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 3.4);
      tl.fromTo("#tc-tag", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 3.9);
      tl.fromTo("#tc-cta", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 4.15);

      window.__timelines["tancament"] = tl;
    })();
  </script>
</template>
</html>
