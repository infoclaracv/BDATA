      function click(at) {
        tl.to("#ta-cursor", { scale: 0.82, duration: 0.07, ease: "power2.in", transformOrigin: "10% 10%" }, at);
        tl.to("#ta-cursor", { scale: 1, duration: 0.14, ease: "power2.out" }, at + 0.07);

      // 0.33 — click Tauler

      click(0.33);
      tl.to("#ta-nav-pr", { backgroundColor: "rgba(255,255,255,0)", color: "#52596b", duration: 0.12 }, 0.36);

      // 1.23 — the payoff: every number builds at once from the same database

        tl.fromTo("#ta-b" + (i + 1), { scaleX: 0 }, { scaleX: v / 62, duration: 1.0, ease: "expo.out" }, 1.23 + i * 0.08);
        const o = { n: 0 };
        tl.to(o, { n: v, duration: 1.0, ease: "expo.out", onUpdate: () => { document.querySelector("#ta-v" + (i + 1)).textContent = Math.round(o.n); } }, 1.23 + i * 0.08);
      });
      const tot = { n: 0 };
      tl.to(tot, { n: 174, duration: 1.1, ease: "expo.out", onUpdate: () => { document.querySelector("#ta-total").firstChild.nodeValue = Math.round(tot.n); } }, 1.23);

      const C = 2 * Math.PI * 104, pct = 0.86;
      const arc = { p: 0 };
      gsap.set("#ta-arc", { attr: { "stroke-dasharray": C, "stroke-dashoffset": C } });

      tl.fromTo("#ta-c1", { x: -30 }, { x: 0, duration: 0.5, ease: "expo.out" }, 2.1);
      tl.fromTo("#ta-c1 span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" }, 2.15);
