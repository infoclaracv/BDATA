<!doctype html>
<html
  lang="ca"
  data-composition-variables='[
    {"id":"brand","type":"color","label":"Color de marca (provisional)","default":"#D7141A"},
    {"id":"ink","type":"color","label":"Color de text","default":"#12202F"},
    {"id":"ground","type":"color","label":"Fons","default":"#F3F5F7"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --brand: #d7141a;
        --brand-soft: color-mix(in srgb, var(--brand) 10%, #fff);
        --ink: #12202f;
        --ground: #f3f5f7;
        --line: #d9dee4;
        --muted: #5d6976;
        --ok: #17985a;
        --warn: #e89b0c;
        --font-display: "Inter", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
        color: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }

      /* Shared app shell for the platform scenes (alumnes, professorat, tauler) */
      .app {
        position: absolute;
        inset: 0;
        background: var(--ground);
        font-family: var(--font-display);
        color: var(--ink);
      }
      .side {
        position: absolute;
        left: 0;
        top: 0;
        width: 320px;
        height: 1080px;
        background: #fff;
        border-right: 1px solid var(--line);
        padding: 52px 32px;
      }
      .brandmark {
        font-weight: 900;
        font-size: 42px;
        letter-spacing: -0.03em;
      }
      .brandmark b {
        color: var(--brand);
        font-weight: 900;
      }
      .brandsub {
        font-size: 21px;
        color: var(--muted);
        margin-top: 6px;
      }
      .nav {
        margin-top: 72px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .nav div {
        font-size: 24px;
        font-weight: 700;
        color: var(--muted);
        padding: 14px 18px;
        border-radius: 12px;
      }
      .nav div.on {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .main {
        position: absolute;
        left: 320px;
        top: 0;
        right: 0;
        bottom: 0;
        padding: 56px 64px;
      }
      .h1 {
        font-size: 54px;
        font-weight: 900;
        letter-spacing: -0.03em;
      }
      .demo {
        position: absolute;
        right: 64px;
        top: 70px;
        font-size: 20px;
        font-weight: 700;
        color: var(--muted);
        border: 2px dashed #b8c0c9;
        border-radius: 10px;
        padding: 8px 14px;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(18, 32, 47, 0.1);
        border: 1px solid var(--line);
      }
      .chip {
        display: inline-block;
        font-size: 21px;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 8px;
        white-space: nowrap;
      }
      .chip.ok {
        background: #e3f4ea;
        color: #127a47;
      }
      .chip.bad {
        background: #fbe3e3;
        color: #b5121a;
      }
      .chip.warn {
        background: #fff1d6;
        color: #8a5a00;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 64px;
        height: 64px;
        z-index: 50;
      }
      .caption {
        position: absolute;
        left: 384px;
        bottom: 56px;
        background: #fff;
        border-left: 12px solid var(--brand);
        border-radius: 10px;
        box-shadow: 0 16px 40px rgba(18, 32, 47, 0.18);
        padding: 22px 36px;
        font-size: 50px;
        font-weight: 900;
        letter-spacing: -0.02em;
        white-space: nowrap;
        z-index: 40;
      }
      .caption em {
        font-style: normal;
        color: var(--brand);
      }
    </style>
  </head>
  <body>
